<!DOCTYPE html>
<html lang="uk" class="h-full w-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>WORKSPACE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            app: {
              bg: '#090b10',
              card: '#111420',
              inner: '#161a29',
              border: 'rgba(255, 255, 255, 0.07)',
              hover: 'rgba(255, 255, 255, 0.03)',
              accent: '#6366f1',
              accentMuted: 'rgba(99, 102, 241, 0.15)',
              accentPurple: '#8b5cf6',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }
    input, textarea {
      user-select: text;
    }
    /* Видалення стрілочок з полів */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    /* Стильний тонкий скрол */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.22);
    }
  </style>

  <!-- Firebase Підключення -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AizaSyA7w1TR4TE1ziaBG0dKzI92nxuoGEM1lqw",
      authDomain: "work-vau.firebaseapp.com",
      projectId: "work-vau",
      storageBucket: "work-vau.firebasestorage.app",
      messagingSenderId: "688337728430",
      appId: "1:688337728430:web:436f588e1aef4bf3474e3f"
    };

    let db;
    let docRef;
    let state = {
      links: [],
      notes: ""
    };

    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      docRef = doc(db, "workspace", "compact_dashboard");

      onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          state = docSnap.data();
        } else {
          state = {
            links: [
              { id: 1, title: 'Таблиця звітів', category: 'Аналітика', type: 'sheet', url: 'https://sheets.google.com' },
              { id: 2, title: 'Робочий диск', category: 'Контент', type: 'drive', url: 'https://drive.google.com' },
              { id: 3, title: 'Сітка публікацій', category: 'План', type: 'sheet', url: 'https://sheets.google.com' }
            ],
            notes: ""
          };
          saveToCloud();
        }
        renderLinks();
        const pad = document.getElementById('notepad-area');
        if (document.activeElement !== pad) {
          pad.value = state.notes || "";
        }
        setCloudStatus(true);
      }, (err) => {
        console.error("Firestore sync error:", err);
        setCloudStatus(false);
      });
    } catch (e) {
      console.error("Firebase init failed:", e);
      setCloudStatus(false);
    }

    async function saveToCloud() {
      if (!docRef) return;
      try {
        await setDoc(docRef, state);
        setCloudStatus(true);
      } catch (e) {
        console.error("Save error:", e);
        setCloudStatus(false);
      }
    }

    function setCloudStatus(isOnline) {
      const dot = document.getElementById('sync-dot');
      const text = document.getElementById('sync-text');
      if (!dot || !text) return;
      if (isOnline) {
        dot.className = "w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.6)]";
        text.textContent = "Cloud Sync";
        text.className = "text-[11px] font-mono text-zinc-300";
      } else {
        dot.className = "w-2 h-2 rounded-full bg-rose-500 animate-pulse";
        text.textContent = "Offline / Error";
        text.className = "text-[11px] font-mono text-rose-400";
      }
    }

    // Рендер посилань
    window.renderLinks = function() {
      const list = document.getElementById('links-list');
      if (!list) return;
      list.innerHTML = '';

      (state.links || []).forEach(item => {
        const card = document.createElement('div');
        card.className = "group relative flex items-center justify-between p-3 rounded-2xl bg-app-inner/60 hover:bg-app-inner border border-app-border hover:border-indigo-500/40 transition duration-200";

        let iconSvg = '';
        if (item.type === 'sheet') {
          iconSvg = `<svg class="w-4 h-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M3 14h18m-9-4v8m-7 4h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>`;
        } else if (item.type === 'drive') {
          iconSvg = `<svg class="w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>`;
        } else {
          iconSvg = `<svg class="w-4 h-4 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>`;
        }

        card.innerHTML = `
          <div class="flex items-center gap-3.5 min-w-0">
            <div class="w-9 h-9 rounded-xl bg-black/40 border border-white/5 flex items-center justify-center shrink-0">
              ${iconSvg}
            </div>
            <div class="min-w-0">
              <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="text-xs font-semibold text-zinc-200 group-hover:text-white transition flex items-center gap-1.5 truncate">
                ${item.title}
                <span class="text-[10px] text-zinc-500 group-hover:text-indigo-400 transition">↗</span>
              </a>
              <span class="text-[10px] text-zinc-500 font-mono block truncate mt-0.5">${item.category || 'Посилання'}</span>
            </div>
          </div>
          <button onclick="deleteLink(${item.id})" class="opacity-0 group-hover:opacity-100 p-1.5 rounded-lg text-zinc-500 hover:text-rose-400 hover:bg-white/5 transition" title="Видалити">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        `;
        list.appendChild(card);
      });
    };

    window.saveNewLink = function() {
      const title = document.getElementById('modal-title').value.trim();
      const category = document.getElementById('modal-cat').value.trim();
      const type = document.getElementById('modal-type').value;
      const url = document.getElementById('modal-url').value.trim();

      if (!title || !url) return;
      state.links.push({ id: Date.now(), title, category, type, url });
      saveToCloud();
      closeModal();
    };

    window.deleteLink = function(id) {
      state.links = state.links.filter(i => i.id !== id);
      saveToCloud();
    };

    // Збереження нотатки без затримок
    let debounce;
    window.onNoteChange = function(val) {
      state.notes = val;
      clearTimeout(debounce);
      debounce = setTimeout(() => {
        saveToCloud();
      }, 500);
    };
  </script>
</head>

<body class="h-screen w-screen bg-app-bg text-zinc-300 overflow-hidden flex flex-col p-4 md:p-6 gap-4 antialiased selection:bg-indigo-600/40 selection:text-white">

  <!-- ВЕРХНІЙ БАР (ЗА РЕФЕРЕНСОМ: ПЛАВНИЙ, ЗАКРУГЛЕНИЙ ОСТРІВЕЦЬ) -->
  <header class="w-full bg-app-card border border-app-border rounded-3xl px-6 py-3.5 flex items-center justify-between shrink-0 shadow-2xl shadow-black/50">
    <div class="flex items-center gap-5">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 shadow-[0_0_12px_rgba(99,102,241,0.8)]"></span>
        <h1 class="text-sm font-extrabold tracking-widest text-white uppercase">WORKSPACE</h1>
      </div>
      <span class="text-zinc-700 font-mono text-sm">/</span>
      <div id="cur-date" class="text-xs text-zinc-400 capitalize font-medium"></div>
    </div>

    <!-- Права частина шапки -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2.5 px-3.5 py-1.5 rounded-full bg-app-inner border border-app-border">
        <span id="sync-dot" class="w-2 h-2 rounded-full bg-zinc-600"></span>
        <span id="sync-text" class="text-[11px] font-mono text-zinc-400">Синхронізація...</span>
      </div>

      <button onclick="openModal()" class="flex items-center gap-2 px-4 py-1.5 rounded-2xl bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 font-medium text-xs transition duration-200 active:scale-95 shadow-sm">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        <span>Додати ресурс</span>
      </button>
    </div>
  </header>

  <!-- ОСНОВНА СІТКА НА ВЕСЬ ЕКРАН БЕЗ СКРОЛУ -->
  <main class="w-full flex-1 grid grid-cols-12 gap-4 min-h-0">

    <!-- КОЛОНКА 1: РЕСУРСИ & ДИСКИ (3 КОЛОНКИ) -->
    <section class="col-span-12 lg:col-span-3 bg-app-card border border-app-border rounded-3xl p-5 flex flex-col justify-between overflow-hidden shadow-2xl shadow-black/40">
      
      <div class="flex items-center justify-between mb-3 shrink-0">
        <div class="flex items-center gap-2.5">
          <div class="p-2 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
          </div>
          <h2 class="text-xs font-bold text-zinc-200 tracking-wider uppercase">Ресурси & Диски</h2>
        </div>
        <span class="text-[10px] font-mono text-zinc-500">Fast Access</span>
      </div>

      <!-- Список посилань із прихованим скролом -->
      <div id="links-list" class="flex-1 space-y-2.5 overflow-y-auto pr-1">
        <!-- Генерується через JS -->
      </div>

      <div class="pt-3.5 mt-2 border-t border-app-border/70 flex items-center justify-between text-[11px] text-zinc-500 font-mono shrink-0">
        <span>Google Docs / Sheets</span>
        <span class="text-indigo-400/80">1-click ↗</span>
      </div>
    </section>

    <!-- КОЛОНКА 2: КАЛЬКУЛЯТОРИ ERR & STORIES (4 КОЛОНКИ) -->
    <section class="col-span-12 lg:col-span-4 bg-app-card border border-app-border rounded-3xl p-5 flex flex-col justify-between overflow-hidden shadow-2xl shadow-black/40">
      
      <div class="flex items-center justify-between mb-3 shrink-0">
        <div class="flex items-center gap-2.5">
          <div class="p-2 rounded-xl bg-purple-500/10 border border-purple-500/20 text-purple-400">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          </div>
          <h2 class="text-xs font-bold text-zinc-200 tracking-wider uppercase">Аналітика & Метрики</h2>
        </div>
        <span class="text-[10px] font-mono text-zinc-500">Auto-calc</span>
      </div>

      <div class="flex-1 flex flex-col justify-between gap-3.5 min-h-0">

        <!-- Блок 1: ERR -->
        <div class="bg-app-inner/60 border border-app-border rounded-2xl p-4 flex flex-col justify-between">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
              <span class="text-xs font-semibold text-zinc-200">ERR за охопленням</span>
            </div>
            
            <div class="flex items-center gap-2 bg-app-bg px-2.5 py-1 rounded-xl border border-app-border">
              <span id="err-result" class="text-sm font-bold font-mono text-indigo-300">0.00%</span>
              <button onclick="copyOnlyValue('err-result')" class="text-zinc-500 hover:text-white transition" title="Скопіювати число">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
              </button>
            </div>
          </div>

          <div class="space-y-2.5">
            <div>
              <input type="text" id="err-reach" placeholder="Охоплення через пробіл..." class="w-full bg-app-bg border border-app-border rounded-xl px-3.5 py-2 text-xs text-zinc-200 font-mono placeholder:text-zinc-600 focus:outline-none focus:border-indigo-500/60 transition">
            </div>
            <div>
              <input type="text" id="err-eng" placeholder="Взаємодії через пробіл..." class="w-full bg-app-bg border border-app-border rounded-xl px-3.5 py-2 text-xs text-zinc-200 font-mono placeholder:text-zinc-600 focus:outline-none focus:border-indigo-500/60 transition">
            </div>
          </div>
        </div>

        <!-- Блок 2: Stories -->
        <div class="bg-app-inner/60 border border-app-border rounded-2xl p-4 flex flex-col justify-between">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <span class="w-1.5 h-1.5 rounded-full bg-purple-400"></span>
              <span class="text-xs font-semibold text-zinc-200">Середні перегляди Stories</span>
            </div>
            
            <div class="flex items-center gap-2 bg-app-bg px-2.5 py-1 rounded-xl border border-app-border">
              <span id="st-result" class="text-sm font-bold font-mono text-purple-300">0</span>
              <button onclick="copyOnlyValue('st-result')" class="text-zinc-500 hover:text-white transition" title="Скопіювати число">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
              </button>
            </div>
          </div>

          <div>
            <input type="text" id="st-views" placeholder="Перегляди сторіз через пробіл..." class="w-full bg-app-bg border border-app-border rounded-xl px-3.5 py-2 text-xs text-zinc-200 font-mono placeholder:text-zinc-600 focus:outline-none focus:border-purple-500/60 transition">
          </div>
        </div>

      </div>

      <div class="pt-3.5 mt-2 border-t border-app-border/70 flex items-center justify-between text-[11px] text-zinc-500 font-mono shrink-0">
        <span>Калькулятор без лімітів</span>
        <span class="text-purple-400/80">Live calculation</span>
      </div>
    </section>

    <!-- КОЛОНКА 3: ВЕЛИКИЙ ШВИДКИЙ БЛОКНОТ (5 КОЛОНОК) -->
    <section class="col-span-12 lg:col-span-5 bg-app-card border border-app-border rounded-3xl p-5 flex flex-col justify-between overflow-hidden shadow-2xl shadow-black/40">
      
      <div class="flex items-center justify-between mb-3 shrink-0">
        <div class="flex items-center gap-2.5">
          <div class="p-2 rounded-xl bg-blue-500/10 border border-blue-500/20 text-blue-400">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
          </div>
          <h2 class="text-xs font-bold text-zinc-200 tracking-wider uppercase">Швидкий Блокнот</h2>
        </div>
        <span class="text-[10px] font-mono text-zinc-500">Auto-save</span>
      </div>

      <!-- Текстове поле без початкового сміття -->
      <div class="flex-1 w-full min-h-0 bg-app-inner/60 border border-app-border rounded-2xl p-4 flex flex-col focus-within:border-indigo-500/40 transition">
        <textarea 
          id="notepad-area" 
          oninput="onNoteChange(this.value)" 
          placeholder="Почніть писати тут (ідеї, пости, копірайт, важливі думки)..." 
          class="w-full flex-1 bg-transparent text-xs sm:text-sm text-zinc-200 placeholder:text-zinc-600 focus:outline-none resize-none leading-relaxed font-sans"
        ></textarea>
      </div>

      <div class="pt-3.5 mt-2 border-t border-app-border/70 flex items-center justify-between text-[11px] text-zinc-500 font-mono shrink-0">
        <span>Хмарна синхронізація</span>
        <span class="text-blue-400/80">Word pad</span>
      </div>
    </section>

  </main>

  <!-- МОДАЛЬНЕ ВІКНО ДОДАВАННЯ РЕСУРСУ -->
  <div id="modal-box" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-app-card border border-app-border rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-app-border">
        <h3 class="text-xs font-bold uppercase tracking-wider text-white">Додати посилання</h3>
        <button onclick="closeModal()" class="text-zinc-500 hover:text-white">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-[10px] text-zinc-500 font-mono mb-1">НАЗВА КАРТКИ</label>
          <input type="text" id="modal-title" placeholder="Таблиця звітів" class="w-full bg-app-inner border border-app-border rounded-xl px-3 py-2 text-zinc-200 focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-[10px] text-zinc-500 font-mono mb-1">КАТЕГОРІЯ</label>
          <input type="text" id="modal-cat" placeholder="Аналітика / Клієнт" class="w-full bg-app-inner border border-app-border rounded-xl px-3 py-2 text-zinc-200 focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-[10px] text-zinc-500 font-mono mb-1">ТИП ІКОНКИ</label>
          <select id="modal-type" class="w-full bg-app-inner border border-app-border rounded-xl px-3 py-2 text-zinc-200 focus:outline-none focus:border-indigo-500">
            <option value="sheet">Таблиця (Sheets)</option>
            <option value="drive">Папка / Диск (Drive)</option>
            <option value="link">Посилання (Веб-сайт)</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] text-zinc-500 font-mono mb-1">URL ПОСИЛАННЯ</label>
          <input type="url" id="modal-url" placeholder="https://docs.google.com/..." class="w-full bg-app-inner border border-app-border rounded-xl px-3 py-2 text-zinc-200 focus:outline-none focus:border-indigo-500">
        </div>
      </div>

      <div class="flex justify-end gap-2.5 pt-2">
        <button onclick="closeModal()" class="px-4 py-2 text-xs text-zinc-400 hover:text-white">Скасувати</button>
        <button onclick="saveNewLink()" class="px-4 py-2 text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl transition">Зберегти</button>
      </div>
    </div>
  </div>

  <script>
    // Дата в шапці
    const now = new Date();
    document.getElementById('cur-date').textContent = new Intl.DateTimeFormat('uk-UA', { weekday: 'short', day: 'numeric', month: 'short' }).format(now);

    function openModal() { document.getElementById('modal-box').classList.remove('hidden'); }
    function closeModal() {
      document.getElementById('modal-box').classList.add('hidden');
      document.getElementById('modal-title').value = '';
      document.getElementById('modal-cat').value = '';
      document.getElementById('modal-url').value = '';
    }

    // Парсер чисел без обмежень
    function extractNumbers(str) {
      if (!str) return [];
      return str.match(/\d+(\.\d+)?/g)?.map(Number) || [];
    }

    function calculate() {
      // 1. ERR
      const reachArr = extractNumbers(document.getElementById('err-reach').value);
      const engArr = extractNumbers(document.getElementById('err-eng').value);

      const totalReach = reachArr.reduce((a, b) => a + b, 0);
      const totalEng = engArr.reduce((a, b) => a + b, 0);

      const errEl = document.getElementById('err-result');
      if (totalReach > 0) {
        errEl.textContent = ((totalEng / totalReach) * 100).toFixed(2) + '%';
      } else {
        errEl.textContent = '0.00%';
      }

      // 2. Stories
      const stArr = extractNumbers(document.getElementById('st-views').value);
      const stEl = document.getElementById('st-result');
      if (stArr.length > 0) {
        const avg = Math.round(stArr.reduce((a, b) => a + b, 0) / stArr.length);
        stEl.textContent = avg.toLocaleString();
      } else {
        stEl.textContent = '0';
      }
    }

    document.getElementById('err-reach').addEventListener('input', calculate);
    document.getElementById('err-eng').addEventListener('input', calculate);
    document.getElementById('st-views').addEventListener('input', calculate);

    // Копіювання суто значення
    function copyOnlyValue(id) {
      const text = document.getElementById(id).textContent;
      navigator.clipboard.writeText(text).then(() => {
        const el = document.getElementById(id);
        const prev = el.textContent;
        el.textContent = 'Copied!';
        setTimeout(() => { el.textContent = prev; }, 700);
      });
    }
  </script>
</body>
</html>
